name: CI & Docker Build

permissions:
  contents: read
  packages: write

on:
  push: {}

jobs:
  test:
    name: Run tests (Python + Node if present)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect & Run Python tests (if present)
        run: |
          set -e
          if [ -f requirements.txt ] || [ -f pyproject.toml ] || ls *.py >/dev/null 2>&1; then
            echo "Python files or dependency file found. Setting up Python..."
            python -V || true
            python -m pip install --upgrade pip
            if [ -f requirements.txt ]; then
              pip install -r requirements.txt
            elif [ -f pyproject.toml ]; then
              pip install . || true
            fi
            # prefer pytest if available
            if command -v pytest >/dev/null 2>&1; then
              pytest
            elif [ -d tests ] || ls test_*.py *_test.py >/dev/null 2>&1; then
              python -m unittest discover
            else
              echo "No Python tests found, skipping Python test step"
            fi
          else
            echo "No Python code/deps detected, skipping Python test step"
          fi

      - name: Detect & Run Node tests (if package.json present)
        run: |
          if [ -f package.json ]; then
            echo "package.json found. Setting up Node..."
            node --version || true
            npm ci || npm install
            if npm test --silent; then
              echo "Node tests passed"
            else
              echo "Node tests failed"
              exit 1
            fi
          else
            echo "No package.json found, skipping Node tests"
          fi

  build:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch, optional)
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

      - name: Image digest
        run: |
          echo "Built and pushed image; digest: ${{ steps.build.outputs.digest }}" || true
