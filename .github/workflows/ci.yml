name: CI/CD Pipeline (Testing & Docker Build)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # -------------------------------------------------------------
  # JOB 1: Automated Unit Testing
  # -------------------------------------------------------------
  test:
    name: 🧪 Run Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: 🚀 Run Pytest
        run: |
          pytest

  # -------------------------------------------------------------
  # JOB 2: Build & Verify Docker Images (and Push if secrets set)
  # -------------------------------------------------------------
  docker:
    name: 🐳 Build & Verify Docker Images
    needs: test  # Runs ONLY if test job passes!
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build Backend Image (Verifies Dockerfile compiles)
      - name: 🛠️ Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false

      # Build Frontend Image (Verifies Nginx Dockerfile compiles)
      - name: 🛠️ Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false

      # Optional Push to Docker Hub (Runs automatically if DOCKER_USERNAME secret is set)
      - name: 🔑 Log in to Docker Hub
        if: ${{ secrets.DOCKER_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 📤 Push Backend Image to Docker Hub
        if: ${{ secrets.DOCKER_USERNAME != '' }}
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/splitwise-backend:latest

      - name: 📤 Push Frontend Image to Docker Hub
        if: ${{ secrets.DOCKER_USERNAME != '' }}
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/splitwise-frontend:latest
