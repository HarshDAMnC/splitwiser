<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splitwise Clone</title>
    <meta name="description" content="A minimalist Splitwise Clone with expense tracking, debt simplification, and group settlements.">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="topbar">
        <div class="logo">
            <span class="logo-icon">💸</span> Splitwise
        </div>
        <div class="header-right">
            <span id="current-user-display">System User</span>
        </div>
    </header>

    <div class="layout">
        <!-- LEFT SIDEBAR: GROUPS & USERS -->
        <aside class="sidebar">
            <div class="sidebar-section">
                <h3>GROUPS <button id="btn-new-group" class="btn-micro" title="Add Group">+</button></h3>
                <ul id="groups-list">
                    <li>Loading groups...</li>
                </ul>
            </div>
            <div class="sidebar-section">
                <h3>USERS <button id="btn-new-user" class="btn-micro" title="Add User">+</button></h3>
                <ul id="users-list">
                    <li>Loading users...</li>
                </ul>
            </div>
        </aside>

        <!-- CENTER MAIN: EXPENSES -->
        <main class="center-content">
            <div class="group-header">
                <h1 id="active-group-name">Select a Group</h1>
                <div class="actions">
                    <button class="btn btn-orange" id="btn-add-expense">Add an expense</button>
                    <button class="btn btn-teal" id="btn-settle-up">Settle up</button>
                </div>
            </div>
            
            <div class="expenses-list" id="expenses-container">
                <div class="empty-state">No group selected or no expenses yet.</div>
            </div>
        </main>

        <!-- RIGHT SIDEBAR: BALANCES -->
        <aside class="right-sidebar">
            <div class="balance-header">
                <h3>GROUP BALANCES</h3>
                <button id="btn-refresh-balances" class="btn-micro" title="Recalculate Graph">↻</button>
            </div>
            <ul id="balances-list" class="balances-list">
                <li class="empty-state">Select a group to view balances.</li>
            </ul>
        </aside>
    </div>

    <!-- =========== MODALS =========== -->

    <!-- Add Expense Modal -->
    <div id="modal-expense" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add an expense</h2>
                <span class="close-btn" onclick="closeModals()">&times;</span>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Description</label>
                    <input type="text" id="exp-desc" placeholder="Enter a description (e.g. Dinner)">
                </div>
                <div class="form-group">
                    <label>Amount ($)</label>
                    <input type="number" id="exp-amount" placeholder="0.00">
                </div>
                <div class="form-group">
                    <label>Paid by</label>
                    <select id="exp-payer"></select>
                </div>

                <!-- Split Mode Toggle -->
                <div class="split-mode-toggle">
                    <button id="btn-split-equal" class="split-tab active" type="button">Split Equally</button>
                    <button id="btn-split-custom" class="split-tab" type="button">Custom Split</button>
                </div>

                <!-- Equal split section -->
                <div id="split-equal-section" class="form-group split-section">
                    <label class="split-label">Select who to split between:</label>
                    <div id="equal-split-users-container"></div>
                    <div class="split-preview" id="equal-split-preview"></div>
                </div>

                <!-- Custom split section (hidden by default) -->
                <div id="split-custom-section" class="form-group split-section" style="display:none;">
                    <label class="split-label">Enter Exact Owed Amounts:</label>
                    <div id="split-users-container"></div>
                </div>

                <button id="submit-expense" class="btn btn-orange btn-full">Save Expense</button>
            </div>
        </div>
    </div>
    
    <!-- Settle Up Modal -->
    <div id="modal-settle" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settle up</h2>
                <span class="close-btn" onclick="closeModals()">&times;</span>
            </div>
            <div class="modal-body">
                <!-- Settle All button -->
                <button id="btn-settle-all" class="btn btn-settle-all" type="button">
                    <span class="settle-all-icon">⚡</span> Settle All Debts at Once
                </button>

                <div class="settle-divider">
                    <span>or settle manually</span>
                </div>

                <div class="form-group">
                    <label>From (Payer)</label>
                    <select id="settle-payer"></select>
                </div>
                <div class="settle-arrow">
                    <span>paid →</span>
                </div>
                <div class="form-group">
                    <label>To (Payee)</label>
                    <select id="settle-payee"></select>
                </div>
                <div class="form-group">
                    <label>Amount ($)</label>
                    <input type="number" id="settle-amount" placeholder="0.00">
                </div>
                <button id="submit-settlement" class="btn btn-teal btn-full">Save Payment</button>
            </div>
        </div>
    </div>

    <!-- Add User Modal -->
    <div id="modal-add-user" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add a User</h2>
                <span class="close-btn" onclick="closeModals()">&times;</span>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="new-user-name" placeholder="Enter user name">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="new-user-email" placeholder="user@example.com">
                </div>
                <div class="form-group">
                    <label>Add to Group (Optional)</label>
                    <select id="new-user-group">
                        <option value="">— No group —</option>
                    </select>
                </div>
                <button id="submit-new-user" class="btn btn-teal btn-full">Create User</button>
            </div>
        </div>
    </div>

    <!-- Confirm Delete Modal -->
    <div id="modal-confirm" class="modal">
        <div class="modal-content modal-confirm-content">
            <div class="modal-header">
                <h2 id="confirm-title">Confirm Delete</h2>
                <span class="close-btn" onclick="closeModals()">&times;</span>
            </div>
            <div class="modal-body">
                <p id="confirm-message" class="confirm-msg"></p>
                <div class="confirm-actions">
                    <button id="confirm-cancel" class="btn btn-cancel" onclick="closeModals()">Cancel</button>
                    <button id="confirm-ok" class="btn btn-danger">Delete</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
</body>
</html>
